# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '35 20 * * 6'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Silence the style tools, for real this time.
      #
      # .codacy.yml's `engines:` block does not work here and we have the proof:
      # 6602b30 disabled phpcs, csslint and stylelint, and eleven commits later
      # the scan still reported 2470 / 263 / 404 of them. A token-backed run
      # takes its tool selection from the Codacy project settings, not from the
      # file in the repo — which .codacy.yml itself predicted might be the case.
      # This is the lever that is actually in this repository, so it is the one
      # that gets used. See .codacy.yml for why these three and not others.
      #
      # EMPTY each run's results; do NOT drop the run. GitHub closes an existing
      # alert when a later analysis FOR THE SAME CATEGORY no longer reports it.
      # Delete the run object and the tool simply stops appearing, so the alerts
      # already open would stay open forever with nothing to close them.
      #
      # That is also why this workflow still exists rather than being deleted:
      # removing it IS deleting the run, for every tool at once, and would strand
      # all 413 open alerts permanently. One quiet run first, then it can go.
      # Reporting zero results is what retires them.
      - name: Drop style-only tool results from the SARIF
        run: |
          # The Codacy CLI writes results.sarif from inside a container running
          # as root, so the runner user can read it but cannot truncate it for
          # writing — the rewrite below died on PermissionError every run. Take
          # ownership first; the file is this job's own scratch output.
          sudo chown "$(id -u):$(id -g)" results.sarif
          python3 - <<'PY'
          import json

          # Every tool Codacy runs here, because none of them is telling this
          # repository anything it does not already ask a better-configured tool
          # for. .github/workflows/php.yml runs php -l, bash -n, node --check,
          # shellcheck WITH THIS PROJECT'S OWN EXCLUSIONS, actionlint, PHPStan
          # level 3 and the full suite on every push. Codacy's shellcheck uses
          # different exclusions and so re-reports SC1090/SC2034/SC2207/SC1007,
          # which php.yml deliberately turns off -- re-litigating a decision
          # already made. The rest is style opinion this codebase does not share
          # ($i/$c/$v are deliberate, and PHPMD's ShortVariable alone was 140
          # alerts).
          #
          # None of it has ever produced a finding with a security severity, and
          # 413 alerts that are all noise is how a real one arrives invisible.
          # CodeQL is what covers security here; it runs separately and is quiet,
          # which is the right answer for this codebase.
          MUTE = ('phpcs', 'csslint', 'stylelint',
                  'phpmd', 'jshint', 'shellcheck',
                  'pylint', 'pylintpython3', 'prospector', 'jackson')

          with open('results.sarif') as fh:
              sarif = json.load(fh)

          print(f"{'tool':32} {'before':>8} {'after':>8}")
          for run in sarif.get('runs', []):
              name = (run.get('tool', {}).get('driver', {}).get('name') or '?')
              before = len(run.get('results', []))
              if any(t in name.lower() for t in MUTE):
                  run['results'] = []
              print(f'{name:32} {before:8} {len(run.get("results", [])):8}')

          with open('results.sarif', 'w') as fh:
              json.dump(sarif, fh)
          PY

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
