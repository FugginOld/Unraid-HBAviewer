  Kept verbatim as the source of the Tabler <symbol> path data for plan 032.

  NOTE: this file is a MOCKUP, not shipped code. Plan 032 takes only the five
  <symbol> bodies from it. Its flat status-colour palette (--st-ok etc.) is
  deliberately NOT adopted — three of those five colours fail the 3:1 contrast
  floor on the white/azure themes, which is why the shipped dots keep the
  gradient fill from lsi_health_gradient(). See plan 032's contrast table.

  Icons are Tabler Icons (MIT licensed), inlined as an SVG sprite:
  alert-triangle, temperature, plug-connected, server-2, topology-star-3, cpu.
  Paths are verbatim from tabler/tabler-icons. Keep the MIT notice if you
  redistribute the plugin.
-->
