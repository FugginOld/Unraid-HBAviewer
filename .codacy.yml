---
# Codacy scans the whole repo with every tool it can apply, and the result was
# 3,436 open alerts with ZERO security findings among them — every one carries
# security_severity_level: none. That is not a clean bill of health, it is a
# broken instrument: a real finding would be invisible in a list that long, so
# the alert page stops being read and the tool stops doing anything.
#
# Two levers below. Paths first, then tools.
#
# ── exclude_paths ────────────────────────────────────────────────────────────
# Things that do not ship: archived design handoffs and old plan markdown under
# plans/, and the vendored minified Chart.js bundle nobody here will reformat.
# This half is CONFIRMED WORKING — remark-lint's 31 alerts on plan markdown went
# to zero after it landed. (30 stale Jshint alerts on plans/archive/047's
# support.js survive as ghosts: that tool stopped reporting, but GitHub only
# auto-closes an alert when the same tool scans again and omits it. Dismiss
# those by hand in the code-scanning UI; nothing in this file will clear them.)
#
# ── engines ──────────────────────────────────────────────────────────────────
# Three tools produce 3,236 of the 3,436 and not one actionable finding between
# them. Disabled with a reason each, because "the linter was noisy" is how a
# useful check gets switched off next time:
#
#   phpcs     2,569 alerts, measuring this repo against the PEAR coding
#             standard, which it does not follow and should not: 1,059 line
#             length, 648 call signature, 216 snake_case function names. Taking
#             its advice means reformatting every PHP file in the plugin,
#             including the long comments that explain why the code is shaped
#             the way it is — the most valuable thing in this codebase.
#
#   csslint     263 alerts, ALL of them the tool failing to parse modern CSS.
#             It was archived by its own authors in 2018, before custom
#             properties: 99 "known-properties" are `Expected (<color>) but
#             found 'var(--text)'`, and its 24 "errors" are `Expected RBRACE`
#             pointing at the column where a `--rail:` declaration begins.
#             chrome.css:359-362 is valid CSS that csslint cannot read.
#
#   stylelint   404 alerts, pure formatting, and mostly fighting a deliberate
#             choice: 89 single-line-max-declarations on chrome.css's one-line
#             token rules, which are written that way to be read as a table.
#
# What survives is the set that can find a defect rather than a preference:
# phpmd, shellcheck, jshint — the last of which matters from plan 057 onward,
# because the plugin's ~1,100 lines of JavaScript now live in real .js files
# and jshint is the only thing that has ever opened them. remark-lint stays on
# for the root docs.
#
# VERIFIED 2026-08-11, AND THE ENGINES BLOCK BELOW DOES NOT WORK. The prediction
# above was right. 6602b30 landed this file on main; eleven commits later the
# 2026-08-09 scan still reported Phpcs 2470, Stylelint 404, Csslint 263 —
# unchanged. A token-backed run takes its tool selection from the Codacy project
# settings, not from here.
#
# The lever that DOES work lives in .github/workflows/codacy.yml, which empties
# those three tools' results out of the SARIF before it is uploaded. It empties
# them rather than deleting the runs, because GitHub only retires an existing
# alert when a later analysis for the same category stops reporting it — drop
# the run and the 3,137 already-open alerts would never close.
#
# The engines block is kept below, doing nothing, for two reasons: it documents
# the intent next to the reasoning, and it starts working for free if Codacy
# ever honours it. exclude_paths above is NOT known to be broken and may well be
# applied; it is cheap either way.
exclude_paths:
  - 'plans/**'
  - '**/chart.umd.min.js'

engines:
  phpcs:
    enabled: false
  csslint:
    enabled: false
  stylelint:
    enabled: false
